spring.application.name=connections-service

server.port=9030
server.servlet.context-path=/connections
spring.neo4j.uri=${DB_URL}
spring.neo4j.authentication.username=${DB_USERNAME}
spring.neo4j.authentication.password=${DB_PASSWORD}

eureka.client.service-url.defaultZone= http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.server.lease-removal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=10